<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>页面不存在 · 我的观展笔记</title>
<style>
  :root { --red:#b8232f; --red-deep:#8e1a24; --ink:#1f2328; --ink-2:#4a5058; --ink-3:#7b828c; --line:#e5e2dc; --bg:#fbfaf8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(1100px 300px at 50% -10%, #fdeceb, rgba(253,236,235,0)) , var(--bg);
    color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px; -webkit-text-size-adjust: 100%;
  }
  .box { max-width: 460px; text-align: center; }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 12px;
    background: linear-gradient(145deg, #d8333f, var(--red-deep));
    display: grid; place-items: center; box-shadow: 0 4px 14px rgba(184,35,47,.28);
  }
  .mark svg { width: 30px; height: 30px; fill: #f6d67a; }
  h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: .3px; }
  p { margin: 0 0 22px; color: var(--ink-2); font-size: 14.5px; line-height: 1.75; }
  a.btn {
    display: inline-block; background: linear-gradient(145deg, #d8333f, var(--red));
    color: #fff; text-decoration: none; font-size: 15px; font-weight: 600;
    padding: 11px 26px; border-radius: 8px;
  }
  .tip { margin-top: 22px; font-size: 12.5px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="box">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.6 5.3 5.9.86-4.25 4.15 1 5.86L12 15.4l-5.25 2.77 1-5.86L3.5 8.16l5.9-.86z"/></svg>
  </div>
  <h1>这个页面找不到了</h1>
  <p>你访问的链接可能已经变更或输入有误。<br>返回首页，即可看到全部 40 个线上展馆入口。</p>
  <a class="btn" href="/">返回首页</a>
  <div class="tip">我的观展笔记</div>
</div>
</body>
</html>
