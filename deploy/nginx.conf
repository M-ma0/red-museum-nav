# 红色博物馆云上观展导航 —— Nginx 站点配置
#
# ⚠️ 启用顺序很重要：
#   证书还没拿到时，本文件里的 443 段会因为证书文件不存在导致 `nginx -t` 失败。
#   两种做法二选一：
#     A. 推荐：直接用 deploy/server-setup.sh，它会先起 HTTP、再自动申请证书
#     B. 手工：先把整个 `server { listen 443 ... }` 段注释掉，reload 成功后
#        执行 `certbot --nginx -d 你的域名`，再取消注释并 reload
#
# 用法：
#   1. 复制到 /etc/nginx/conf.d/red-museum-nav.conf
#   2. 把 yunjian.example.com 全部替换成你的真实域名
#   3. 把证书路径替换成你的证书路径
#   4. 确认 root 路径与站点实际目录一致
#   5. nginx -t && systemctl reload nginx
#
# 站点目录结构（上传后）：
#   /var/www/red-museum-nav/
#   ├─ index.html
#   ├─ go.html
#   ├─ 404.html
#   ├─ assets/
#   ├─ data/
#   └─ images/

# ---------- HTTP：跳转到 HTTPS（微信业务域名校验要求 HTTPS）----------
server {
    listen 80;
    listen [::]:80;
    server_name yunjian.example.com;

    # 证书签发用（certbot webroot / acme.sh 模式）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # 微信域名归属校验文件必须能直接取到（形如 MP_verify_xxxx.txt）
    location ~ "^/[A-Za-z0-9_\-]+\.txt$" {
        root /var/www/red-museum-nav;
        try_files $uri =404;
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    # 兼容 nginx 1.18（Ubuntu 22.04 自带）到 1.25+；1.25+ 会提示 http2 参数已弃用，不影响运行
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yunjian.example.com;

    # 证书：腾讯云免费证书或 Let's Encrypt 均可
    ssl_certificate     /etc/nginx/ssl/yunjian.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/yunjian.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/red-museum-nav;
    index index.html;
    charset utf-8;

    # 微信域名归属校验文件（形如 MP_verify_xxxxxxxx.txt）
    # 必须放在站点根目录，且通过 https://域名/文件名.txt 直接返回文件内容。
    # 单独设一个 location，避免被下面的 try_files 兜到 index.html。
    location ~ "^/[A-Za-z0-9_\-]+\.txt$" {
        try_files $uri =404;
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 预览图：长缓存（文件名固定，更新时靠改文件名或刷新 CDN）
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 样式与脚本：中缓存
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # HTML 不缓存，方便改完立刻生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 纯静态站没有前端路由：找不到就真 404，这样自定义 404.html 才会生效
    # （若写成兜底 /index.html，任何错链都会返回首页 200，404 页永远不出现）
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ---------- 弱网优化：压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- 基础安全头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
