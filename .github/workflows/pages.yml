name: Deploy static site to GitHub Pages

# 站点是纯静态的，只需要把 index.html / go.html / assets / data / images 原样发布即可。
# 构建工具（tools/、node_modules/、_build/）不参与部署。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署；排队中的旧任务直接取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # upload-pages-artifact 只接受单个 path，所以先按需打包成 tar，
      # 这样既能精确控制发布内容，也避免把 tools/ 一并发布。
      - name: Archive site files
        run: |
          tar \
            --dereference --hard-dereference \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            index.html go.html assets data images README.md

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
